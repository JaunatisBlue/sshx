name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sshx
            base_name: sshx-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sshx.exe
            base_name: sshx-windows-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 让二进制里显示的版本号和 tag 一致（v0.4.1 -> 0.4.1）
      - name: Sync version
        shell: bash
        run: |
          sed -i "s/^version = \"[^\"]*\"/version = \"${{ steps.get_version.outputs.VERSION }}\"/" Cargo.toml
          grep '^version' Cargo.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # out/ 里放最终产物，文件名已经带好版本号
      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          BIN_NAME: ${{ matrix.bin_name }}
          BASE_NAME: ${{ matrix.base_name }}
          IS_WINDOWS: ${{ matrix.os == 'windows-latest' }}
        run: |
          mkdir -p out stage

          # 1) 原始可执行文件：Windows 用户下载后直接双击就能用
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "out/${BASE_NAME}-${VERSION}$( [ "$IS_WINDOWS" = "true" ] && echo '.exe' )"
          chmod +x "out/${BASE_NAME}-${VERSION}"* 2>/dev/null || true

          # 2) 压缩包：包含可执行文件 + README + LICENSE
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "stage/${{ matrix.bin_name }}"
          cp README.md LICENSE stage/

          if [ "$IS_WINDOWS" = "true" ]; then
            # Windows 上用 PowerShell 打包，保证产物是合法的 zip
            powershell -Command "Compress-Archive -Path 'stage/*' -DestinationPath 'out/${BASE_NAME}-${VERSION}.zip'"
          else
            tar -czf "out/${BASE_NAME}-${VERSION}.tar.gz" -C stage "${{ matrix.bin_name }}" README.md LICENSE
          fi

          rm -rf stage
          ls -l out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshx-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/
          merge-multiple: true

      - name: List assets
        run: ls -l out/

      # 一次创建 release，所有平台的文件一起挂上去
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
