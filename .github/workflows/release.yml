name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sshx
            archive_template: sshx-linux-amd64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sshx.exe
            archive_template: sshx-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 让二进制里显示的版本号和 tag 一致（v0.4.1 -> 0.4.1）
      - name: Sync version
        shell: bash
        run: |
          sed -i "s/^version = \"[^\"]*\"/version = \"${{ steps.get_version.outputs.VERSION }}\"/" Cargo.toml
          grep '^version' Cargo.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCHIVE_NAME="${{ matrix.archive_template }}"
          ARCHIVE_NAME="${ARCHIVE_NAME//VERSION/$VERSION}"

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.bin_name }}"
          cp README.md LICENSE dist/

          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows 上用 PowerShell 打包，保证产物是合法的 zip
            powershell -Command "Compress-Archive -Path 'dist/*' -DestinationPath '$ARCHIVE_NAME'"
          else
            tar -czvf "$ARCHIVE_NAME" -C dist "${{ matrix.bin_name }}" README.md LICENSE
          fi
          ls -l "$ARCHIVE_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
